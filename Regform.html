<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

        <link rel="stylesheet" href="./Regform.css">
        <h1>Job Application: Senior Web Developer</h1>
        <p>Thank you for your interest in joining our team.Please fill out the application below</p>
        <hr>

    <form>
        <h2>Personal Information</h2>

        <label for="Name">Full Name:</label>
        <br>
        <input type="text" name="Full name" id="Name">

        <br>
        <br>

        <label for="Email">Email:</label>
        <br>
        <input type="email" name="Email" id="email">

        <br>
        <br>

        <label for="Phone number">Phone:</label>
        <br>
        <input type="number" name="Phone number" id="Phone Number">
        
        <br>
        <br>
        
        <label for="Linkedin url">Linkdin Profile URL:</label>
        <br> 
        <Input type="url" name="Linkedin Profile URL" id="linkedink URL" placeholder="https://linkedin.com/in/yourprofile">

        <hr>

        <h2>Professional Experience</h2>

        <label for="Resume">Upload Your Resume(PDF or DOCX)</label>    
        <br>
        <input type="file" name="Resume" id="Resume">

        <br>
        <br>
        
        <label for="Cover letter">Cover letter</label>    
        <br>
        <textarea name="Cover letter" id="Cover letter" cols="30" rows="10" placeholder="Tell us why you're a great fit for this role...."></textarea>
        
        <br>
        <br>

        <label for="Years of Professional Experience">Years of Professional Experience</label>
        <br>
        <input type="number" name="experience" id="Experience">    
               
        <br>
        <br>
        
        <label for="Earliest Possible Start Date">Earliest Possible Start Date</label>   
        <br>
        <input type="date" name="Start date" id="Start Date">

        <hr>   
        
        
        <h2>Skills & Availability</h2>
        
        

        <label>Primary Skillset (Choose One):</label><br>

        <div class="radio-group">
            
        <input type="radio" name="skill" id="frontend" value="Frontend" checked>
        <label for="frontend">Frontend Development</label>
        
        <br>

        <input type="radio" name="skill" id="backend" value="Backend">
        <label for="backend">Backend Development</label>
        
        <br>

        <input type="radio" name="skill" id="fullstack" value="Full-Stack">
        <label for="fullstack">Full-Stack Development</label>
        </div>
        <br><br>
        
        <label for="additional Skills">Additional Skills(Select all that apply):</label>
        
        <br>
        
        <label for="React">react</label>
        <input type="checkbox" name="React" id="React">
        <br>
        
        <label for="Node.js">Node.js</label>
        <input type="checkbox" name="Node.js" id="Node.js">
        <br>

        <label for="Database Management">Database Management</label>
        <input type="checkbox" name="Database Management" id="Database Management">
        <br>

        <label for="Cloud/DevOps">Cloud/DevOps</label>
        <input type="checkbox" name="Cloud/DevOps" id="Cloud/DevOps">
        <br><br>    

        <label for="Preferred Work type:">Preferred Work type:</label><br>
        <select name="Work" id="Work">
            <option value="Full-time">Full-Time</option>  
            <option value="Part-time">Part-Time</option>  
        </select>
        
        <hr>

        <h2>Final Confirmation</h2>

        <label for="Confirmation">I am legally authorized to work in this country.</label>
        <input type="checkbox" name="Confirmation" id="Confirmation">

        <label for="about us">How did you hear about us?</label>
        <input type="text" name="About us" id="About us" placeholder="e.g., Linkedin, company">
        <br>
        
        <button type="submit">Submit Application</button>
        <button type="reset">Clear form</button>
        
    </form>


</body>
</html>
